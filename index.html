<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NMS - Network Management System</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- Inter + Noto Sans KR + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* React 로드 전 초기 로딩 화면 - 흰 화면 방지 */
      body { margin: 0; background: #0f0f23; }
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.3s ease;
      }
      #app-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .preloader-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .preloader-bg::before {
        content: '';
        position: absolute;
        top: -50%; left: -50%;
        width: 200%; height: 200%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: preloader-grid 20s linear infinite;
      }
      .preloader-glow-1,
      .preloader-glow-2 {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.25;
        animation: preloader-float 12s ease-in-out infinite;
      }
      .preloader-glow-1 {
        width: 300px; height: 300px;
        background: rgba(59, 130, 246, 0.2);
        top: 15%; left: 15%;
      }
      .preloader-glow-2 {
        width: 250px; height: 250px;
        background: rgba(139, 92, 246, 0.15);
        bottom: 20%; right: 15%;
        animation-delay: 4s;
      }
      .preloader-center {
        position: relative;
        z-index: 1;
        text-align: center;
        animation: preloader-fadeIn 0.5s ease-out;
      }
      .preloader-logo {
        width: 64px; height: 64px;
        margin-bottom: 28px;
        animation: preloader-pulse 2.5s ease-in-out infinite;
      }
      .preloader-ring {
        width: 36px; height: 36px;
        margin: 0 auto 18px;
        border: 2.5px solid rgba(255, 255, 255, 0.06);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: preloader-spin 0.75s linear infinite;
      }
      .preloader-text {
        color: #64748b;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      @keyframes preloader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes preloader-fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes preloader-float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(20px, -20px) scale(1.1); }
      }
      @keyframes preloader-grid {
        to { transform: translate(50px, 50px); }
      }
    </style>
  </head>
  <body>
    <!-- 초기 로딩 화면: React가 마운트되면 제거됨 -->
    <div id="app-preloader">
      <div class="preloader-bg">
        <div class="preloader-glow-1"></div>
        <div class="preloader-glow-2"></div>
      </div>
      <div class="preloader-center">
        <img src="/logo-single.svg" alt="" class="preloader-logo" />
        <div class="preloader-ring"></div>
        <p class="preloader-text">Loading</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
